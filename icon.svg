<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Filename Prefix">
  <title>Filename Prefix</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f2a"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="344" height="344" rx="76" fill="url(#tile)" stroke="#2a2a36" stroke-width="2"/>
  <!-- The token sigil: every filename_prefix variable is delimited by `%`.
       Drawn as geometry (two rings + a slash) rather than a font glyph so it
       renders identically without Inter installed. -->
  <g fill="none" stroke="#ffb02e" stroke-width="19" stroke-linecap="round">
    <circle cx="148" cy="139" r="29"/>
    <circle cx="252" cy="243" r="29"/>
    <line x1="134" y1="263" x2="266" y2="119"/>
  </g>
  <!-- The filename field the token is typed into. -->
  <line x1="126" y1="314" x2="274" y2="314" stroke="#ffb02e" stroke-width="14"
        stroke-linecap="round" opacity="0.4"/>
</svg>
